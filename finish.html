<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="訪問介護・医療職向け引き継ぎ連絡票アプリ（クラウド版）。作業終了画面。">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="引き継ぎ連絡票">
  <meta name="theme-color" content="#ffffff">

  <title>作業終了 - 引き継ぎ連絡票</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --focus:   #0055cc;
      --bg:      #f4f4f0;
      --surface: #ffffff;
      --border:  #c8c8c8;
      --txt:     #111111;
      --txt-sub: #555555;
      --font: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
              "Noto Sans JP", sans-serif;
      --rad-md: 8px;
      --rad-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:      #1a1a1a;
        --surface: #2a2a2a;
        --border:  #555;
        --txt:     #f0f0f0;
        --txt-sub: #aaaaaa;
      }
    }

    html { font-size: 16px; }

    body {
      font-family: var(--font);
      font-size: 1rem;
      line-height: 1.65;
      background: var(--bg);
      color: var(--txt);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    #app {
      max-width: 540px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      padding-top: calc(24px + env(safe-area-inset-top));
      gap: 24px;
      text-align: center;
    }

    h1 {
      font-size: 1.375rem;
      font-weight: 700;
      color: var(--txt);
    }

    .lead {
      font-size: 0.9375rem;
      color: var(--txt-sub);
    }

    .btn-primary {
      display: block;
      width: 100%;
      max-width: 320px;
      padding: 16px;
      font-family: var(--font);
      font-size: 1.0625rem;
      font-weight: 600;
      background: var(--focus);
      color: #fff;
      border: none;
      border-radius: var(--rad-md);
      cursor: pointer;
      min-height: 52px;
      text-align: center;
    }
    .btn-primary:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  </style>
</head>
<body>

  <!-- ライブリージョン（aria-live通知） -->
  <div id="live-region" role="status" aria-live="polite" aria-atomic="true" class="sr-only"></div>

  <div id="app">
    <div role="status">
      <h1>引き継ぎ連絡を終了しました。お疲れ様でした。</h1>
      <p class="lead">セッションを終了しました。次にご利用の際は、あらためて暗証番号を入力してください。</p>
    </div>

    <button class="btn-primary" type="button"
            aria-label="タイトル画面に戻ります"
            onclick="location.href='index.html'">
      タイトル画面に戻る
    </button>
  </div>

  <script src="config.js"></script>
  <script>
    // finish.html到達時点でセッション（ロール情報）を必ず破棄する
    clearSession();
    announce('引き継ぎ連絡を終了しました。お疲れ様でした。');

    function announce(msg) {
      const el = document.getElementById('live-region');
      el.textContent = '';
      requestAnimationFrame(() => { el.textContent = msg; });
    }
  </script>

</body>
</html>
