<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="引き継ぎ連絡票アプリ 暗証番号入力画面。">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="引き継ぎ連絡票">
  <meta name="theme-color" content="#ffffff">

  <title>暗証番号入力 - 引き継ぎ連絡票</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --focus:   #0055cc;
      --danger:  #c0392b;
      --bg:      #f4f4f0;
      --surface: #ffffff;
      --border:  #c8c8c8;
      --txt:     #111111;
      --txt-sub: #555555;
      --font: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
              "Noto Sans JP", sans-serif;
      --rad-md: 8px;
      --rad-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:      #1a1a1a;
        --surface: #2a2a2a;
        --border:  #555;
        --txt:     #f0f0f0;
        --txt-sub: #aaaaaa;
      }
    }

    html { font-size: 16px; }

    body {
      font-family: var(--font);
      font-size: 1rem;
      line-height: 1.65;
      background: var(--bg);
      color: var(--txt);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    #app {
      max-width: 400px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px;
      padding-top: calc(24px + env(safe-area-inset-top));
      gap: 18px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--txt);
      text-align: center;
    }

    .card {
      background: var(--surface);
      border-radius: var(--rad-lg);
      border: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      display: block;
      font-size: 0.9375rem;
      color: var(--txt-sub);
      margin-bottom: 6px;
    }

    input[type="password"] {
      width: 100%;
      font-family: var(--font);
      font-size: 1.5rem;
      letter-spacing: 0.4em;
      text-align: center;
      padding: 12px 10px;
      border: 1px solid var(--border);
      border-radius: var(--rad-md);
      background: var(--surface);
      color: var(--txt);
      min-height: 52px;
    }
    input[type="password"]:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .btn-primary {
      display: block;
      width: 100%;
      padding: 14px;
      font-family: var(--font);
      font-size: 1.0625rem;
      font-weight: 600;
      background: var(--focus);
      color: #fff;
      border: none;
      border-radius: var(--rad-md);
      cursor: pointer;
      min-height: 52px;
      text-align: center;
    }
    .btn-primary:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-secondary {
      display: block;
      width: 100%;
      padding: 10px;
      font-family: var(--font);
      font-size: 0.9375rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--rad-md);
      cursor: pointer;
      min-height: 44px;
      color: var(--txt);
    }
    .btn-secondary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

    /* ─── エラーメッセージ ───────────────────────── */
    .error-box {
      background: #fff0f0;
      border: 1px solid #e0aaaa;
      color: var(--danger);
      border-radius: var(--rad-md);
      padding: 10px 12px;
      font-size: 0.875rem;
      display: none;
    }
    .error-box.show { display: block; }

    @media (prefers-color-scheme: dark) {
      .error-box { background: #3a1f1f; border-color: #7a3a3a; color: #ff8a8a; }
    }
  </style>
</head>
<body>

  <!-- ライブリージョン（aria-live通知） -->
  <div id="live-region" role="status" aria-live="polite" aria-atomic="true" class="sr-only"></div>

  <div id="app">
    <h1>暗証番号（PIN）を入力してください</h1>

    <form id="pin-form" class="card" novalidate>
      <div>
        <label for="pin-input">暗証番号（4桁）</label>
        <input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]*"
               maxlength="4" autocomplete="off"
               aria-label="暗証番号を入力してください"
               aria-describedby="pin-error">
      </div>

      <div id="pin-error" class="error-box" role="alert"></div>

      <button id="pin-submit" type="submit" class="btn-primary">認証する</button>
      <button type="button" class="btn-secondary" onclick="location.href='index.html'">
        タイトル画面に戻る
      </button>
    </form>
  </div>

  <script src="config.js"></script>
  <script>
    const form      = document.getElementById('pin-form');
    const input     = document.getElementById('pin-input');
    const errorBox  = document.getElementById('pin-error');
    const submitBtn = document.getElementById('pin-submit');

    checkLockoutOnLoad();
    input.focus();

    function checkLockoutOnLoad() {
      if (isLockedOut()) {
        redirectToBlockedIndex();
      }
    }

    function redirectToBlockedIndex() {
      const remainMin = Math.ceil(getLockoutRemainingMs() / 60000);
      announce('アクセスがブロックされています。約' + remainMin + '分後に再度お試しください。');
      alert('3回連続で認証に失敗したため、アクセスをブロックしています。約' + remainMin + '分後に再度お試しください。');
      location.href = 'index.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (isLockedOut()) {
        redirectToBlockedIndex();
        return;
      }

      const pin = input.value.trim();
      if (!/^\d{4}$/.test(pin)) {
        showError('暗証番号は4桁の数字で入力してください。');
        return;
      }

      submitBtn.disabled = true;
      try {
        const hash = await sha256Hex(pin);

        let role;
        try {
          role = await verifyPin(hash);
        } catch (e) {
          showError('通信エラーが発生しました。ネットワーク接続をご確認のうえ、もう一度お試しください。');
          return;
        }

        if (role === 'owner' || role === 'helper') {
          clearLockout();
          setSession(role);
          announce('認証に成功しました。' + (role === 'owner' ? 'オーナー' : 'ヘルパー') + 'としてログインします。');
          location.href = 'home.html';
          return;
        }

        const state = recordFailedAttempt();
        if (state.lockedUntil && state.lockedUntil > Date.now()) {
          redirectToBlockedIndex();
          return;
        }

        showError('暗証番号が違います。もう一度入力してください。');
        input.value = '';
        input.focus();
      } finally {
        submitBtn.disabled = false;
      }
    });

    // PIN照合：GAS_URL設定済みならGAS（PropertiesService）を正として照合し、
    // GAS_URL未設定時のみconfig.js内のハッシュ値で照合する（移行期のフォールバック）。
    async function verifyPin(hash) {
      if (CONFIG.GAS_URL) {
        const result = await callGas({ action: 'verifyPin', hash });
        return result && result.role ? result.role : null;
      }
      if (hash === CONFIG.PIN_HASH_OWNER)  return 'owner';
      if (hash === CONFIG.PIN_HASH_HELPER) return 'helper';
      return null;
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('show');
      announce(msg);
    }

    function announce(msg) {
      const el = document.getElementById('live-region');
      el.textContent = '';
      requestAnimationFrame(() => { el.textContent = msg; });
    }
  </script>

</body>
</html>
